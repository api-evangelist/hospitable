- aid: hospitable:hospitable-webhooks-api
  name: Hospitable Webhooks API
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.hospitable.com/docs/public-api-docs/k4ctofvqu0w8g-hospitable-api-v2
  baseURL: https://public.api.hospitable.com/v2
  properties:
  - url: https://developer.hospitable.com/docs/public-api-docs/k4ctofvqu0w8g-hospitable-api-v2
    type: Documentation
  - url: >-
      https://help.hospitable.com/en/articles/10008203-webhooks-for-reservations-properties-messages-and-reviews
    type: Documentation
  description: >-
    Hospitable v2 webhooks push near-real-time event notifications (reservation.created, reservation.changed,
    property.created/changed/deleted/merged, message.created, review.created) as JSON POST requests to
    a host-configured endpoint. Webhooks are configured in the dashboard (Apps > Webhooks); delivery is
    retried up to five times with exponential back-off.
